name: Atualizar preços

on:
  schedule:
    - cron: "23 9 * * *"   # todo dia, 06:23 no horário de Brasília
  workflow_dispatch: {}     # permite rodar na mão pelo app do GitHub

permissions:
  contents: write

concurrency:
  group: precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar preços (Apify)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update_prices.py
      - name: Salvar preços novos
        if: always()
        run: |
          git config user.name "wellnesshub-bot"
          git config user.email "wellnesshub-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Atualiza preços" && git push)
